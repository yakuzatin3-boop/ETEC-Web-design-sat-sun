<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
</head>
<body>


    <form action="">
        <h1><i><u>Student Information</u></i></h1>

        <label >Enter Name </label><br>
        <input type="text" name="name" placeholder="Student Name"><br><br>

        <label >Enter Email</label><br>
        <input type="email" name="email" placeholder="Email"><br><br>

        <label>Gender</label><br>
        <label>Male</label>
        <input type="checkbox" name="Male" id="">

        <label >Female</label>
        <input type="checkbox" name="female" id=""><br><br>

        <label>Student Skill</label><br>
        <label>Program</label>
        <input type="radio" name="Program" id="">

        <label >Network</label>
        <input type="radio" name="Network" id=""><br><br>


        <label style="font-size: 30px; color: red;" >Tech-Skill</label><br><br>

        <label ><i class="bi bi-filetype-html"></i> : 82%</label>
        <input type="range" name="HTML" value="82" id=""><br>

        <label ><i class="bi bi-filetype-css"> : 82%</i></label>
        <input type="range" name="css" value="82" id=""><br><br>

        <label >Date of birth : </label>
        <input type="date" name="" id="">

    </form>
    
</body>
</html>
